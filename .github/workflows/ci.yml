name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reelearn
          POSTGRES_PASSWORD: reelearn
          POSTGRES_DB: reelearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reelearn" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      # S3-compatible object storage: the worker tests upload and read media through it.
      storage:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: reelearn
          RUSTFS_SECRET_KEY: reelearn123
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://reelearn:reelearn@localhost:5432/reelearn
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: reelearn
      S3_SECRET_KEY: reelearn123
      APP_ENV: test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --all --check
        working-directory: api
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: api
      - name: Wait for object storage
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:9000; then exit 0; fi
            sleep 1
          done
          echo "object storage did not start" && exit 1
      - run: cargo test --workspace
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
        env:
          NEXT_PUBLIC_API_MOCK: "true"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: dart format --set-exit-if-changed lib test
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@latest lint openapi/openapi.yaml
