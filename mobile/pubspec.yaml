name: reelearn_mobile
description: Reelearn mobile app. The employee minute and the manager screens in one Flutter app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  camera: ^0.11.0+2
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: any
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
